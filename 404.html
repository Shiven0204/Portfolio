<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The page you are looking for could not be found."
    />
    <title>404 | Shiven's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .error-page {
        position: relative;
        width: min(680px, calc(100% - 32px));
        padding: clamp(2rem, 6vw, 4rem);
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
        isolation: isolate;
      }

      .error-page::before,
      .error-page::after {
        content: "";
        position: absolute;
        z-index: -1;
        pointer-events: none;
        border: 1px solid var(--border);
        opacity: 0.45;
      }

      .error-page::before {
        inset: 14px;
        border-radius: 16px;
      }

      .error-page::after {
        top: 50%;
        left: 10%;
        right: 10%;
        height: 1px;
        background: var(--border);
        border: 0;
      }

      .error-code {
        display: block;
        margin-bottom: 0.75rem;
        color: var(--text-soft);
        font-size: clamp(4.5rem, 16vw, 8rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.08em;
      }

      .error-page h1 {
        margin-bottom: 0.8rem;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        line-height: 1.08;
        letter-spacing: -0.05em;
      }

      .error-page p {
        max-width: 430px;
        margin: 0 auto 1.7rem;
        color: var(--text-soft);
      }

      .error-page .button {
        position: relative;
      }

      @media (max-width: 520px) {
        .error-page {
          padding: 2rem 1.2rem;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="error-page" aria-labelledby="error-title">
      <span class="error-code" aria-hidden="true">404</span>
      <p class="eyebrow">Page not found</p>
      <h1 id="error-title">This page took a wrong turn.</h1>
      <p>
        The page may have moved, been removed, or never existed. Head back to
        the portfolio and keep exploring.
      </p>
      <a class="button primary" href="index.html">Return home</a>
    </main>
  </body>
</html>
